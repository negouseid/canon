<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canon · Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff8e9;font-family:Arial,Helvetica,sans-serif}body.preview{background:radial-gradient(ellipse at 60% 30%,#30343d,#11151d 75%)}.preview-label{display:none;position:absolute;top:28px;left:32px;font:12px monospace;letter-spacing:3px;color:#8792a1}.preview .preview-label{display:block}.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left}.reveal{position:absolute;right:5%;bottom:17%;width:660px;max-height:74%;overflow:hidden;padding:34px 38px 32px;background:linear-gradient(120deg,#181d23fa,#10141cf5);border:1px solid #bdff7160;border-left:5px solid #c3ff79;box-shadow:0 24px 90px #0006;opacity:0;transform:translateY(38px) scale(.96);transform-origin:bottom right}.reveal.active{animation:arrive .6s cubic-bezier(.16,1,.3,1) forwards}.reveal.leaving{animation:leave .45s ease-in forwards}.eyebrow{display:flex;align-items:center;gap:10px;color:#c3ff79;font-size:13px;font-weight:800;letter-spacing:4px}.seal{display:inline-grid;place-items:center;border:1px solid #c3ff7970;border-radius:50%;width:26px;height:26px;letter-spacing:0;font-size:16px}.line{height:1px;background:linear-gradient(90deg,#c3ff7970,transparent);margin:22px 0}h1{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:48px;line-height:1.05;letter-spacing:-1.5px;margin:0 0 16px;overflow-wrap:anywhere}.definition{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden;font-size:25px;line-height:1.45;margin:0;color:#e0e2dc;overflow-wrap:anywhere}.credit{margin-top:25px;color:#94a08d;font:12px monospace;letter-spacing:1px}.spark{position:absolute;right:4%;bottom:15%;width:12px;height:12px;border:1px solid #c3ff79;opacity:0}.active~.spark{animation:spark .9s ease-out}.ticker{position:absolute;bottom:4%;left:5%;right:5%;display:flex;align-items:center;gap:22px;background:#11171ee8;border:1px solid #ffffff18;padding:17px 24px;min-height:70px;box-shadow:0 8px 30px #0003}.brand{font-size:19px;font-weight:900;letter-spacing:-1px;color:#c3ff79;border-right:1px solid #ffffff26;padding-right:24px}.lore{font-size:16px;line-height:1.45;color:#cbd0cb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lore strong{color:#fff8e9}.status{position:absolute;top:25px;right:30px;font:11px monospace;color:#b7a991;opacity:0}.preview .status,.status.offline{opacity:1}@keyframes arrive{to{opacity:1;transform:translateY(0) scale(1)}}@keyframes leave{to{opacity:0;transform:translateY(-15px)}}@keyframes spark{0%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(18) rotate(100deg)}}@media(prefers-reduced-motion:reduce){.reveal.active{animation:none;opacity:1;transform:none}.reveal.leaving{animation:none;opacity:0}.active~.spark{animation:none}}
</style></head><body><div class="preview-label">OBS PREVIEW / 1920 × 1080</div><div class="status" id="status">CONNECTING</div><main class="stage"><section class="reveal" id="reveal" aria-live="polite" aria-hidden="true"><div class="eyebrow"><span class="seal">✓</span> CANONIZED <span id="testLabel"></span></div><div class="line"></div><h1 id="term"></h1><p class="definition" id="definition"></p><div class="credit" id="credit"></div></section><div class="spark"></div><aside class="ticker"><div class="brand">canon.</div><div class="lore" id="lore">The channel remembers. Your next chapter is waiting.</div></aside></main>
<script>
if(new URLSearchParams(location.search).has('preview'))document.body.classList.add('preview');
const $=id=>document.getElementById(id);
function fitCanvas(){const scale=Math.min(innerWidth/1920,innerHeight/1080);document.querySelector('.stage').style.transform=`translate(${(innerWidth-1920*scale)/2}px,${(innerHeight-1080*scale)/2}px) scale(${scale})`}addEventListener('resize',fitCanvas);fitCanvas();let entries=[],index=0,queue=[],showing=false,burstUntil=0,bursts=[];
function ticker(){if(Date.now()<burstUntil)return;if(bursts.length){burstUntil=Date.now()+12000;$('lore').textContent=bursts.shift();return}if(!entries.length)return;const e=entries[index++%entries.length];$('lore').replaceChildren();const title=document.createElement('strong');title.textContent=e.term+'  /  ';$('lore').append(title,document.createTextNode(e.definition));}
function showNext(){if(showing||!queue.length)return;showing=true;const event=queue.shift(),e=event.entry;$('term').textContent=e.term;$('definition').textContent=e.definition;$('credit').textContent='RECORDED BY '+e.author+' · CHANNEL HISTORY';$('testLabel').textContent=event.test?' / TEST':'';$('reveal').className='reveal';void $('reveal').offsetWidth;$('reveal').setAttribute('aria-hidden','false');$('reveal').className='reveal active';setTimeout(()=>{$('reveal').className='reveal leaving';setTimeout(()=>{$('reveal').className='reveal';$('reveal').setAttribute('aria-hidden','true');showing=false;showNext()},500)},9000)}
let retry=1000;function connect(){const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>{retry=1000;$('status').textContent='LIVE CONNECTION';$('status').classList.remove('offline')};ws.onmessage=({data})=>{let event;try{event=JSON.parse(data)}catch{return}if(event.type==='snapshot'){entries=event.entries;ticker()}if(event.type==='community'){if(bursts.length<10)bursts.push(event.text);ticker()}if(event.type==='canonized'){if(queue.length<20)queue.push(event);showNext()}};ws.onclose=()=>{$('status').textContent='RECONNECTING';$('status').classList.add('offline');setTimeout(connect,retry);retry=Math.min(retry*2,15000)};ws.onerror=()=>ws.close()}connect();setInterval(ticker,12000);
</script></body></html>
